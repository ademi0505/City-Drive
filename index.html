<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>City Drive — назначения водителей</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260825-6" />
  </head>
  <body>
    <main class="app-shell">
      <section class="auth-panel" id="authPanel">
        <div class="brand-block">
          <p class="eyebrow">Общая сменная база</p>
          <h1>City Drive</h1>
          <p>Единый список ресторанов, водителей и назначений для всех координаторов.</p>
          <div class="brand-visual" aria-hidden="true">
            <img src="assets/city-drive-team.jpeg?v=20260825-2" alt="" />
          </div>
        </div>

        <form class="auth-card" id="authForm">
          <div class="tabs" role="tablist" aria-label="Режим входа">
            <button type="button" class="tab active" data-mode="login">Вход</button>
            <button type="button" class="tab" data-mode="register">Регистрация</button>
            <button type="button" class="tab" data-mode="delete">Удаление</button>
          </div>

          <label id="nameField">
            Имя
            <input type="text" id="nameInput" autocomplete="name" required />
          </label>

          <label id="passwordField">
            Пароль
            <input type="password" id="passwordInput" autocomplete="current-password" required />
          </label>

          <fieldset id="roleField" hidden>
            <legend>Тип аккаунта</legend>
            <label class="role-choice">
              <input type="radio" name="role" value="coordinator" checked />
              <span>Координатор</span>
            </label>
            <label class="role-choice">
              <input type="radio" name="role" value="manager" />
              <span>Управляющий</span>
            </label>
          </fieldset>

          <p class="form-error" id="authError" aria-live="polite"></p>
          <button type="submit" class="primary-btn" id="authSubmit">Войти</button>
        </form>

        <section class="auth-card account-admin hidden" id="accountAdmin">
          <h2>Аккаунты</h2>
          <div class="account-list" id="accountList"></div>
        </section>
      </section>

      <section class="dashboard hidden" id="dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="roleLabel"></p>
            <h2 id="userTitle"></h2>
          </div>
          <button type="button" class="secondary-btn" id="logoutBtn">Выйти</button>
        </header>

        <section class="coordinator-view hidden" id="coordinatorView">
          <div class="summary-grid">
            <article>
              <span>Назначено водителей</span>
              <strong id="assignedCount">0</strong>
            </article>
            <article>
              <span>Сумма водителям за месяц</span>
              <strong id="totalAmount">0 тг</strong>
            </article>
          </div>

          <nav class="section-nav" id="coordinatorNav">
            <button type="button" class="secondary-btn" data-page="drivers">Водители</button>
            <button type="button" class="secondary-btn" data-page="restaurants">Рестораны</button>
          </nav>

          <div id="coordinatorMain">
            <div class="manager-report-filters hidden" id="managerReportFilters"></div>

            <div class="workspace-grid">
              <form class="panel" id="assignmentForm">
                <h3>Назначить водителя</h3>
                <label>
                  Поиск водителя
                  <input type="search" id="driverSearchInput" placeholder="Имя или номер машины" />
                </label>
                <label>
                  Водители
                  <div class="driver-checklist" id="driverChecklist"></div>
                </label>
                <label>
                  Поиск ресторана
                  <input type="search" id="assignmentRestaurantSearchInput" placeholder="Название ресторана" />
                </label>
                <label>
                  Ресторан
                  <select id="restaurantSelect" required></select>
                </label>
                <label>
                  Дата
                  <input type="date" id="timeInput" required />
                </label>
                <button type="submit" class="primary-btn">Назначить</button>
                <p class="hint" id="assignmentHint"></p>
              </form>
            </div>

            <section class="panel report-panel">
              <div class="panel-header">
                <h3>Отчёт за месяц</h3>
                <input type="month" id="monthFilter" />
              </div>
              <div class="report-tools">
                <input type="search" id="reportSearchInput" placeholder="Поиск водителя, ресторана или даты" />
                <label class="date-filter">
                  От
                  <input type="date" id="reportDateFromInput" />
                </label>
                <label class="date-filter">
                  До
                  <input type="date" id="reportDateToInput" />
                </label>
                <strong id="reportSearchSummary"></strong>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr id="reportHead">
                      <th>Дата</th>
                      <th>Водитель</th>
                      <th>Ресторан</th>
                      <th>Сумма</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="reportBody"></tbody>
                </table>
              </div>
            </section>
          </div>

          <section class="panel management-page hidden" id="driversPage">
            <div class="panel-header">
              <h3>Водители</h3>
              <strong class="list-count" id="driversCount">0</strong>
              <button type="button" class="secondary-btn compact-btn" data-page="main">Назад</button>
            </div>
            <form class="inline-form driver-form" id="driverForm">
              <input type="text" id="newDriverNameInput" placeholder="Имя водителя" />
              <input type="text" id="newDriverCarInput" placeholder="Номер машины" />
              <label class="check-row trainee-row">
                <input type="checkbox" id="newDriverTraineeInput" />
                <span>Стажировка</span>
              </label>
              <label class="trainee-start-row">
                Стажёр с
                <input type="date" id="newDriverTraineeSinceInput" />
              </label>
              <button type="submit" class="secondary-btn">Добавить</button>
            </form>
            <input type="search" class="panel-search" id="driverManageSearchInput" placeholder="Поиск водителя" />
            <div class="restaurant-list" id="driverManageList"></div>
          </section>

          <section class="panel management-page hidden" id="restaurantsPage">
            <div class="panel-header">
              <h3>Рестораны</h3>
              <strong class="list-count" id="restaurantsCount">0</strong>
              <button type="button" class="secondary-btn compact-btn" data-page="main">Назад</button>
            </div>
            <form class="inline-form restaurant-form" id="restaurantForm">
              <input type="text" id="restaurantNameInput" placeholder="Название" />
              <input type="number" id="restaurantDriverPriceInput" placeholder="Сумма водителю" min="0" step="100" value="3000" />
              <button type="submit" class="secondary-btn">Добавить</button>
            </form>
            <input type="search" class="panel-search" id="restaurantSearchInput" placeholder="Поиск ресторана" />
            <div class="restaurant-list" id="restaurantList"></div>
          </section>
        </section>

        <section class="driver-view hidden" id="driverView">
          <section class="panel driver-panel">
            <h3>Мои назначения</h3>
            <div class="assignment-list" id="driverAssignments"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="app.js?v=20260825-7"></script>
  </body>
</html>
